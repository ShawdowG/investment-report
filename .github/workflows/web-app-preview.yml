name: web-app — Revamp Preview

# Branch deployment for the current app revamp.
# Production stays untouched — main pushes still go through web-app-production.yml.
on:
  push:
    branches: [revamp-2026]
    paths:
      - "web-app/**"
      - "data/quotes/**"
      - "data/company/**"
      - ".github/workflows/web-app-preview.yml"
  workflow_dispatch:

jobs:
  build-and-preview:
    name: Build & Deploy preview to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality gate and static export
        run: npm run check
        env:
          NODE_ENV: production

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name investment-report-app --branch ${{ github.ref_name }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: web-app — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "web-app/**"
      - "data/quotes/**"
      - "data/company/**"
      - ".github/workflows/web-app-production.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality gate and static export
        run: npm run check

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name investment-report-app --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
